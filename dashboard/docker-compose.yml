# Local development: Postgres plus the API in "all" mode (ingest + dashboard routes, local
# file storage, dev tokens). See dashboard/README.md.
#
#   docker compose -f dashboard/docker-compose.yml up -d db        # Postgres only (tests)
#   docker compose -f dashboard/docker-compose.yml up --build      # Postgres + API on :8000
#
# Tests use the olmo_eval_test database and drop its schema; the API uses olmo_eval_dev.

configs:
  create_dev_db:
    content: |
      CREATE DATABASE olmo_eval_dev;

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: olmo
      # Local-only database (the port is bound to 127.0.0.1), so no password.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: olmo_eval_test
    configs:
      - source: create_dev_db
        target: /docker-entrypoint-initdb.d/10-create-dev-db.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olmo -d olmo_eval_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        API_MODE: all
    environment:
      SKIFF_ENV: local
      DB_URL: postgresql+asyncpg://olmo@db:5432/olmo_eval_dev
      STORAGE_BACKEND: local
      INGEST_DEV_AUTH: "true"
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
