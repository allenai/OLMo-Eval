server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_proxied any;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location = /healthz { access_log off; return 200 "ok"; }

  # The API sidecar serves its routes under /api, so the URI passes through unchanged.
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/security-headers.conf; }
  location /fonts/  { types { font/otf otf; } try_files $uri =404; add_header Cache-Control "public, max-age=604800"; include /etc/nginx/snippets/security-headers.conf; }
  location = /favicon.ico { try_files $uri =404; }

  # SPA routes can contain dots (model names), so everything else falls back to index.html.
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
