# Used by the alembic CLI during development, e.g.
#   DB_URL=postgresql+asyncpg://olmo@localhost:5433/olmo_eval_test uv run alembic upgrade head
# The API itself runs migrations at startup (olmo_eval_api.db.migrate).
[alembic]
script_location = %(here)s/src/olmo_eval_api/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
