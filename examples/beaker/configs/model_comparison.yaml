# Multi-model comparison config
# Evaluates multiple models on the same tasks, one experiment per model
# Usage: olmo-eval beaker launch -f examples/beaker/configs/model_comparison.yaml \
#            -w <workspace> [-B <budget>] --dry-run

name: eval-model-comparison
models:
  - llama3.1-8b
  - olmo-2-7b
  - mistral-7b
tasks:
  - mmlu
  - gsm8k
  - hellaswag
  - arc_challenge
  - winogrande

cluster: h100
gpus: 1
priority: normal
min_runtime: 2h
timeout: 24h
