# Large model evaluation config
# Configured for 70B+ models requiring multiple GPUs
# Usage: olmo-eval beaker launch -f examples/beaker/configs/large_model.yaml \
#            -w <workspace> [-B <budget>] --dry-run

name: eval-llama70b-full
models:
  - meta-llama/Llama-3.1-70B-Instruct
tasks:
  - mmlu
  - gsm8k
  - hellaswag
  - arc_challenge
  - winogrande

cluster: h100
gpus: 4
priority: high
min_runtime: 8h
timeout: 48h
retries: 2
