name: Skiff2 Plan
on:
    pull_request:
        branches:
            - main
        paths:
            - dashboard/**
            - skiff2.json
            - .github/workflows/skiff2-*.yml

# needed to authenticate with google
permissions:
    contents: read
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        runs-on: ubuntu-latest
        env:
            # Fork PRs get no OIDC token, so they skip the GCP steps.
            TRUSTED: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            - name: Skip fork PRs
              if: env.TRUSTED != 'true'
              run: echo "Fork PRs cannot authenticate to GCP, so the Skiff2 plan is skipped."

            # Skiff2's shared actions are owned by Ai2 and track the platform, so they stay on main.
            - name: Skiff2 Setup
              id: setup
              if: env.TRUSTED == 'true'
              uses: allenai/skiff2-actions/shared-actions/setup@main
              with:
                  workload_identity_provider: ${{ vars.SKIFF2_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.SKIFF2_SERVICE_ACCOUNT }}
                  project_id: ${{ vars.SKIFF2_PROJECT_ID }}

            - name: Skiff2 Plan Infra
              if: env.TRUSTED == 'true'
              uses: allenai/skiff2-actions/shared-actions/deploy-infra@main
              with:
                  project_id: ${{ vars.SKIFF2_PROJECT_ID }}
                  command: plan

            - name: Skiff2 Plan Services
              if: env.TRUSTED == 'true'
              uses: allenai/skiff2-actions/shared-actions/deploy-services@main
              with:
                  project_id: ${{ vars.SKIFF2_PROJECT_ID }}
                  command: plan
