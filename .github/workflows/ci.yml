name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependencies are downloaded fresh in each job rather than restored with actions/cache.
# The environment includes CUDA torch wheels (about 3.6 GB), which restore more slowly
# than uv downloads them, and caches that large evict each other from the repository's
# 10 GB cache allowance. setup-uv keeps its own small cache of wheels built from source.
env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # Verification: Linting and Type Checking
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Run the locked ruff version without installing the project environment.
      - name: Resolve locked ruff version
        run: echo "RUFF_VERSION=$(uv export --frozen --only-group dev --no-hashes --no-emit-project | sed -n 's/^ruff==//p')" >> "$GITHUB_ENV"

      - name: Run Ruff linter
        run: uvx "ruff@${RUFF_VERSION}" check src/ tests/

      - name: Run Ruff formatter check
        run: uvx "ruff@${RUFF_VERSION}" format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run type checker
        run: uv run --frozen --no-group vllm --extra clients --extra litellm --extra agents ty check src/

  # ============================================================================
  # File Sizes: block tracked files larger than 1 MB
  # ============================================================================
  file-sizes:
    name: File Sizes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check file sizes
        run: ./scripts/check_file_sizes.sh

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Coverage is reported from the 3.12 job only, so the 3.13 job skips collecting it.
      - name: Run unit tests
        env:
          COVERAGE_ARGS: >-
            ${{ matrix.python-version == '3.12'
              && '--cov=src/olmo_eval --cov-report=xml --cov-report=html --cov-report=term-missing'
              || '' }}
        run: |
          uv run --frozen --no-group vllm pytest tests/ \
            --ignore=tests/integration/ \
            -v \
            -n 4 --dist worksteal \
            $COVERAGE_ARGS

      - name: Generate coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          uv run --frozen --no-group vllm coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || uv run --frozen --no-group vllm coverage report >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ============================================================================
  # Build Check
  # ============================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Verify package contents
        run: |
          ls -la dist/
          uv run --frozen --no-group vllm python -m zipfile -l dist/*.whl | head -50

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ============================================================================
  # All Checks Passed
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, file-sizes, test, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.file-sizes.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
